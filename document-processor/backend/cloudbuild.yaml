steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/sm-gemini-playground/document-processing-be', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/sm-gemini-playground/document-processing-be']
- name: 'gcr.io/cloud-builders/gcloud'
  args: ['run', 'deploy', 'document-processing-be', '--image', 'gcr.io/sm-gemini-playground/document-processing-be', '--region', 'europe-north1','--allow-unauthenticated', '--platform', 'managed', '--memory', '500Mi', '--max-instances', '5', '--update-env-vars', 'API=']
images:
- gcr.io/sm-gemini-playground/document-processing-be